<!DOCTYPE html>
<html>

<head>

    <title>

        {% block title %}
        Expense Tracker
        {% endblock %}

    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>
    
<div class="container">
    <h1>Personal Expense Tracker</h1>
    
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
        
    {% endblock %}

</div>
    
{% block scripts %}
{% endblock %}

</body>
</html>
