{% extends "layout.html" %}

{% block title %}
Edit Expense
{% endblock %}


{% block content %}

<h2>Edit Expense</h2>

<form method="POST">
    <label>Category</label>

    <input
        type="text"
        name="category"
        value="{{ expense[1] }}"
    >

    <br><br>

    <label>Amount</label>

    <input
        type="number"
        step="0.01"
        name="amount"
        value="{{ expense[2] }}"
    >

    <br><br>

    <label for="date">Date</label>

    <input
        id="date"
        type = "text"
        name="date"
        value="{{ expense[3] }}"
    >

    <br><br>

    <button type="submit">Save Changes</button>
</form>

<p>
    <a href="/">Cancel</a>
</p>

{% endblock %}
